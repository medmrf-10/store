<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="paper">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('store.theme')||'paper'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#F4EEE2">
<title>الاتصال — المتجر</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --r-2:16px;--r-pill:999px;
  --font-display:'Amiri',serif;--font-body:'Noto Naskh Arabic',serif;
  --ease:cubic-bezier(0.22,0.61,0.36,1);--app-max:560px;
}
:root,[data-theme='paper']{
  --bg:#f4eee2;--card:#fbf7ef;--text:#26201a;--muted:#7d7162;--line:#e2d6c0;
  --primary:#1b4d3e;--gold:#a87f3c;--soft:#ece2cf;--press:#efe6d5;
  --glass:rgba(244,238,226,.92);color-scheme:light;
}
[data-theme='night']{
  --bg:#14110e;--card:#1c1814;--text:#efe6d6;--muted:#a39684;--line:#2f2923;
  --primary:#e3a598;--gold:#c9a35c;--soft:#2a241e;--press:#241f1a;
  --glass:rgba(20,17,14,.9);color-scheme:dark;
}
[data-theme='white']{
  --bg:#ffffff;--card:#f5f6f8;--text:#0d0e10;--muted:#65676b;--line:#d8dce2;
  --primary:#1b4d3e;--gold:#a87f3c;--soft:#e8ebef;--press:#eff1f4;
  --glass:rgba(255,255,255,.92);color-scheme:light;
}
[data-theme='dark']{
  --bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--line:#3e4042;
  --primary:#e3a598;--gold:#c9a35c;--soft:#3a3b3c;--press:#2d2e2f;
  --glass:rgba(24,25,26,.92);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{min-height:100dvh;max-width:var(--app-max);margin:0 auto;padding:0 0 48px}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,var(--app-max));z-index:6;
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.trow{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px 0 8px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.brand b{font:700 22px/1 var(--font-display);color:var(--text)}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
  color:var(--muted);border:0;background:none;font:inherit;cursor:pointer}
.ib:active{background:var(--press)}
.themes{position:fixed;z-index:9;left:10px;top:calc(58px + env(safe-area-inset-top));min-width:170px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.14)}
.themes button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;
  background:none;color:inherit;font:inherit;font-size:15px;text-align:right;cursor:pointer}
.themes button[aria-pressed='true']{background:var(--press);font-weight:600}
.themes i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(127,127,127,.35)}
main{display:block;padding:calc(84px + env(safe-area-inset-top)) 20px 24px;text-align:center}
.ic{width:98px;height:98px;margin:0 auto 16px;border-radius:26px;overflow:hidden;
  box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--gold),0 14px 32px rgba(38,32,26,.16)}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
h1{font:700 34px/1.3 var(--font-display);margin:0}
.meta{margin-top:8px;color:var(--gold);font-size:13.5px}
.wnew{margin:14px auto 0;max-width:420px;padding:12px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-2);color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:210px;height:52px;margin-top:24px;
  padding:0 28px;border-radius:var(--r-pill);background:var(--primary);color:#fff;font:inherit;font-size:16.5px;
  font-weight:600;text-decoration:none;border:0;cursor:pointer}
.dl:active{opacity:.88}
.dl svg{width:20px;height:20px}
.dl.soon{background:var(--soft);color:var(--muted);pointer-events:none}
.sub{margin-top:12px;color:var(--muted);font-size:12.5px}
.back{display:inline-block;margin-top:28px;color:var(--muted);font-size:13.5px;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="trow">
      <a class="brand" href="../"><img src="../icons/icon-192.png?v=3" alt=""><b>المتجر</b></a>
      <button class="ib" id="b-theme" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg></button>
    </div>
  </header>
  <div class="themes" id="themes" hidden>
    <button data-t="paper"><i style="background:#F4EEE2"></i>ورقي</button>
    <button data-t="night"><i style="background:#14110E"></i>ليل</button>
    <button data-t="white"><i style="background:#FFFFFF"></i>أبيض</button>
    <button data-t="dark"><i style="background:#18191A"></i>داكن</button>
  </div>
  <main>
    <div class="ic"><img src="icon-512.png" alt="أيقونة الاتصال"></div>
    <h1 id="aname">الاتصال</h1>
    <div class="meta" id="ameta">جارٍ التحميل...</div>
    <div class="wnew" id="awnew" hidden></div>
    <a class="dl soon" id="adl" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 10.5 12 15l4.5-4.5M4.5 19h15"/></svg>
      <span id="adlt">تنزيل APK</span>
    </a>
    <div class="sub" id="asub">تحديث تلقائي مباشر من داخل التطبيق</div>
    <a class="back" href="../">العودة إلى المتجر</a>
  </main>
</div>
<script>
const SLUG='dialer';
const THEME_COLORS={paper:'#F4EEE2',night:'#14110E',white:'#FFFFFF',dark:'#18191A'};
const metaTheme=document.getElementById('meta-theme');
const TH=document.getElementById('themes');
const saved=localStorage.getItem('store.theme')||'paper';
if(metaTheme&&THEME_COLORS[saved])metaTheme.content=THEME_COLORS[saved];
document.querySelectorAll('#themes button').forEach(b=>{
  b.setAttribute('aria-pressed',b.dataset.t===saved?'true':'false');
  b.onclick=e=>{
    e.stopPropagation();
    document.documentElement.dataset.theme=b.dataset.t;
    localStorage.setItem('store.theme',b.dataset.t);
    if(metaTheme&&THEME_COLORS[b.dataset.t])metaTheme.content=THEME_COLORS[b.dataset.t];
    document.querySelectorAll('#themes button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
    TH.hidden=true;
  };
});
document.getElementById('b-theme').onclick=e=>{e.stopPropagation();TH.hidden=!TH.hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#themes,#b-theme'))TH.hidden=true});

function resolveUrl(u){
  if(!u)return '';
  if(/^https?:\/\//.test(u)||u.startsWith('/')||u.startsWith('../'))return u;
  return '../'+u.replace(/^\.\//,'');
}

fetch('../apps.json',{cache:'no-cache'})
  .then(r=>r.ok?r.json():null)
  .then(d=>{
    const a=d&&Array.isArray(d.apps)?d.apps.find(x=>x.slug===SLUG):null;
    if(!a)return;
    document.getElementById('aname').textContent=a.name;
    document.getElementById('ameta').textContent=[a.version?'إصدار '+a.version:'',a.size,a.updated||''].filter(Boolean).join(' · ');
    if(a.whatsnew){const w=document.getElementById('awnew');w.textContent=a.whatsnew;w.hidden=false}
    const href=resolveUrl(a.url);
    if(href){
      const dl=document.getElementById('adl');
      dl.classList.remove('soon');
      dl.href=href;
      dl.setAttribute('download','');
    }
  })
  .catch(()=>{});
</script>
</body>
</html>
