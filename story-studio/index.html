<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="paper">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('store.theme')||'paper'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#F4EEE2">
<title>القصص — المتجر</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r-2:16px;--r-pill:999px;--font-display:'Amiri',serif;--font-body:'Noto Naskh Arabic',serif;--app-max:560px}
:root,[data-theme='paper']{--bg:#f4eee2;--card:#fbf7ef;--text:#26201a;--muted:#7d7162;--line:#e2d6c0;--primary:#6E233C;--gold:#a87f3c;--soft:#ece2cf;--press:#efe6d5;--glass:rgba(244,238,226,.92);color-scheme:light}
[data-theme='night']{--bg:#14110e;--card:#1c1814;--text:#efe6d6;--muted:#a39684;--line:#2f2923;--primary:#e3a598;--gold:#c9a35c;--soft:#2a241e;--press:#241f1a;--glass:rgba(20,17,14,.9);color-scheme:dark}
[data-theme='white']{--bg:#ffffff;--card:#f5f6f8;--text:#0d0e10;--muted:#65676b;--line:#d8dce2;--primary:#6E233C;--gold:#a87f3c;--soft:#e8ebef;--press:#eff1f4;--glass:rgba(255,255,255,.92);color-scheme:light}
[data-theme='dark']{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--line:#3e4042;--primary:#e3a598;--gold:#c9a35c;--soft:#3a3b3c;--press:#2d2e2f;--glass:rgba(24,25,26,.92);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px}
.app{min-height:100dvh;max-width:var(--app-max);margin:0 auto;padding:0 0 48px}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,var(--app-max));z-index:6;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px)}
.trow{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.brand b{font:700 22px/1 var(--font-display)}
main{padding:calc(88px + env(safe-area-inset-top)) 20px 24px;text-align:center}
.ic{width:98px;height:98px;margin:0 auto 16px;border-radius:26px;overflow:hidden;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--gold),0 14px 32px rgba(38,32,26,.16)}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
h1{font:700 34px/1.3 var(--font-display);margin:0}
.meta{margin-top:8px;color:var(--gold);font-size:13.5px}
.dl{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:210px;height:52px;margin-top:24px;padding:0 28px;border-radius:var(--r-pill);background:var(--primary);color:#fff;font:inherit;font-size:16.5px;font-weight:600;text-decoration:none}
.dl.soon{background:var(--soft);color:var(--muted);pointer-events:none}
.back{display:inline-block;margin-top:26px;color:var(--muted);font-size:13.5px;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="trow"><a class="brand" href="../"><img src="../icons/icon-192.png?v=3" alt=""><b>المتجر</b></a></div></header>
  <main>
    <div class="ic"><img src="icon-512.png" alt="القصص"></div>
    <h1 id="aname">القصص</h1>
    <div class="meta" id="ameta">إصدار 1.0.0</div>
    <a class="dl soon" id="adl" href="#">تنزيل APK</a>
    <div><a class="back" href="../">العودة إلى المتجر</a></div>
  </main>
</div>
<script>
const SLUG='story-studio';
fetch('../apps.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{
  const a=d&&Array.isArray(d.apps)?d.apps.find(x=>x.slug===SLUG):null;
  if(!a)return;
  document.getElementById('aname').textContent=a.name;
  document.getElementById('ameta').textContent=[a.version?'إصدار '+a.version:'',a.size].filter(Boolean).join(' · ');
  if(a.url){const dl=document.getElementById('adl');dl.classList.remove('soon');dl.href=a.url;dl.setAttribute('download','');}
}).catch(()=>{});
</script>
</body>
</html>
