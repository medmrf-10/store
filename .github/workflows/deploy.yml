name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: جهّز حزمة المتجر
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          cp apps.json apps.js manifest.webmanifest sw.js dist/
          cp -r icons dist/
          for d in */; do
            name="${d%/}"
            case "$name" in
              dist|android|auto-update|icons) continue ;;
            esac
            if [ -f "$d/index.html" ] || [ "$name" = "apk" ]; then
              cp -r "$name" dist/
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
