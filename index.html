<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('irth.theme')||'night'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<link rel="manifest" href="manifest.webmanifest">
<title>ميراث — تحميل التطبيق</title>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --r-1:12px;--r-2:16px;--r-pill:999px;
  --font-display:'Amiri',serif;--font-body:'Noto Naskh Arabic',serif;
  --ease:cubic-bezier(0.22,0.61,0.36,1);
  --app-max:560px;
}
:root,[data-theme='night']{
  --bg:#14110e;--card:#1c1814;--text:#efe6d6;--muted:#a39684;--line:#2f2923;
  --primary:#e3a598;--gold:#c9a35c;--soft:#2a241e;--press:#241f1a;
  --glass:rgba(20,17,14,.9);color-scheme:dark;
}
[data-theme='paper']{
  --bg:#f4eee2;--card:#fbf7ef;--text:#2a241d;--muted:#8a7e6e;--line:#e5dac6;
  --primary:#7b2d26;--gold:#ae8848;--soft:#eadfcb;--press:#f2eadb;
  --glass:rgba(244,238,226,.9);color-scheme:light;
}
[data-theme='white']{
  --bg:#ffffff;--card:#f0f2f5;--text:#050505;--muted:#65676b;--line:#ced0d4;
  --primary:#7b2d26;--gold:#ae8848;--soft:#e4e6eb;--press:#f0f2f5;
  --glass:rgba(255,255,255,.92);color-scheme:light;
}
[data-theme='dark']{
  --bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--line:#3e4042;
  --primary:#e3a598;--gold:#c9a35c;--soft:#3a3b3c;--press:#2d2e2f;
  --glass:rgba(24,25,26,.92);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px}
a{color:var(--primary)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.app{min-height:100dvh;max-width:var(--app-max);margin:0 auto;padding:0 0 48px}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,var(--app-max));z-index:6;
  padding-top:env(safe-area-inset-top);
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.trow{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px 0 6px}
main{display:block;padding-top:calc(56px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:9px}
.brand b{font:700 25px/1 var(--font-display);color:var(--primary)}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
  color:var(--muted);border:0;background:none;font:inherit;cursor:pointer}
.ib:active{background:var(--press)}
.themes{position:fixed;z-index:9;left:10px;top:calc(56px + env(safe-area-inset-top));min-width:170px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18);animation:fade .15s ease-out}
.themes button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;
  background:none;color:inherit;font:inherit;font-size:15px;text-align:right;cursor:pointer}
.themes button[aria-pressed='true']{background:var(--press);font-weight:600}
.themes i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(127,127,127,.35)}

.hero{text-align:center;padding:30px 20px 4px;animation:rise .5s var(--ease) both}
.hero h1{font:700 34px/1.3 var(--font-display);margin:0}
.hero p{margin:8px auto 0;max-width:400px;color:var(--muted);font-size:14.5px;line-height:1.9}

.gttl{margin:24px 16px 8px;color:var(--gold);font-size:13px;font-weight:700}
.list{margin:0 16px}
.arow{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-2);margin-bottom:10px;text-decoration:none;color:inherit;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.arow:active{background:var(--press)}
.arow .aic{flex:none;width:56px;height:56px;border-radius:15px;overflow:hidden;background:var(--soft);box-shadow:0 0 0 1px var(--line)}
.arow .aic img{width:100%;height:100%;object-fit:cover}
.arow .atx{flex:1;min-width:0}
.arow .anm{font:700 19px/1.35 var(--font-display)}
.arow .ads{display:block;color:var(--muted);font-size:12.5px;line-height:1.8;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arow .amt{color:var(--muted);font-size:11.5px;margin-top:4px}
.arow .amt i{font-style:normal;color:var(--gold)}
.sttag{flex:none;font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:var(--r-pill);padding:1px 8px;white-space:nowrap}
.chev{flex:none;color:var(--muted)}
.chev svg{width:20px;height:20px}
.empty{padding:46px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-2)}
.foot{margin:26px 16px 0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2);
  color:var(--muted);font-size:12.5px;line-height:1.9;text-align:center}
/* لافتة التثبيت */
.pb{position:fixed;z-index:8;left:50%;transform:translateX(-50%) translateY(120%);bottom:14px;width:min(calc(100% - 24px),calc(var(--app-max) - 24px));
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--gold);border-radius:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.pb.show{transform:translateX(-50%) translateY(0)}
.pb img{width:44px;height:44px;border-radius:12px;flex:none}
.pb .pt{flex:1;min-width:0}
.pb .pt b{display:block;font:700 15px/1.4 var(--font-display)}
.pb .pt span{color:var(--muted);font-size:12px}
.pb .pin{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r-pill);
  background:var(--primary);color:var(--card);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:0;text-decoration:none}
.pb .pin svg{width:16px;height:16px}
.pb .pin:active{background:var(--press);color:var(--primary)}
.pb .px{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;padding:0}
.pb .px:active{background:var(--press)}
.pb .px svg{width:15px;height:15px}
.tost{position:fixed;z-index:10;left:50%;bottom:90px;transform:translateX(-50%);padding:10px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-pill);color:var(--text);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.tost.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="trow">
      <a class="brand" href="./"><img src="mirath/icons/icon-192.png" alt=""><b>ميراث</b></a>
      <button class="ib" id="b-theme" aria-label="الشكل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg></button>
    </div>
  </header>
  <div class="themes" id="themes" hidden>
    <button data-t="night"><i style="background:#14110E"></i>ليل</button>
    <button data-t="paper"><i style="background:#F4EEE2"></i>ورق</button>
    <button data-t="white"><i style="background:#FFFFFF"></i>أبيض</button>
    <button data-t="dark"><i style="background:#18191A"></i>داكن</button>
  </div>
  <main>
    <section class="hero">
      <h1>ميراث</h1>
      <p>تطبيق واحد: ميراث — رابط التنزيل المباشر لأحدث إصدار.</p>
    </section>
    <div class="gttl">التطبيق</div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="pb" id="pb" hidden>
  <img src="icons/icon-192.png" alt="">
  <div class="pt"><b>ثبّت المتجر</b><span>متجرنا في شاشتك الرئيسية بلمسة واحدة</span></div>
  <button class="pin" id="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 10.5 12 15l4.5-4.5M4.5 19h15"/></svg>تثبيت</button>
  <button class="px" id="px" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<div class="tost" id="tost"></div>
<script src="apps.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH=document.getElementById('themes');
const saved=localStorage.getItem('irth.theme')||'night';
document.querySelectorAll('#themes button').forEach(b=>{
  b.setAttribute('aria-pressed',b.dataset.t===saved?'true':'false');
  b.onclick=e=>{e.stopPropagation();document.documentElement.dataset.theme=b.dataset.t;localStorage.setItem('irth.theme',b.dataset.t);
    document.querySelectorAll('#themes button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));TH.hidden=true};
});
document.getElementById('b-theme').onclick=e=>{e.stopPropagation();TH.hidden=!TH.hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#themes,#b-theme'))TH.hidden=true});
/* — لافتة التثبيت — */
let DEFER=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
const PB=document.getElementById('pb'),TOST=document.getElementById('tost');
function toast(t){TOST.textContent=t;TOST.classList.add('show');setTimeout(()=>TOST.classList.remove('show'),2400)}
function installed(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
try{if(!installed()&&localStorage.getItem('store.pb.dismiss')!=='1'){setTimeout(()=>{PB.hidden=false;requestAnimationFrame(()=>PB.classList.add('show'))},1400)}}catch(e){}
document.getElementById('px').onclick=()=>{PB.classList.remove('show');setTimeout(()=>PB.hidden=true,300);try{localStorage.setItem('store.pb.dismiss','1')}catch(e){}};
document.getElementById('pin').onclick=async()=>{
  if(DEFER){DEFER.prompt();const r=await DEFER.userChoice;if(r.outcome==='accepted'){PB.classList.remove('show');setTimeout(()=>PB.hidden=true,300)}DEFER=null;return}
  toast('من قائمة المتصفح اختر: إضافة إلى الشاشة الرئيسية');
};
document.getElementById('list').innerHTML=(APPS||[]).map((a,i)=>{
  const meta=[a.version?'إصدار '+a.version:'',a.size,a.url?'':'قريباً'].filter(Boolean).join(' · ');
  const dest=a.page||a.url||'';
  return `<a class="arow" style="--i:${i}" href="${esc(dest)}"${a.page?'':' download'}>
    <span class="aic"><img src="${esc(a.icon)}" alt=""></span>
    <span class="atx"><span class="anm">${esc(a.name)}</span>
    <span class="ads">${esc(a.desc||'')}</span>
    ${meta?`<span class="amt"><i>${esc(meta)}</i></span>`:''}</span>
    ${a.tag?`<span class="sttag">${esc(a.tag)}</span>`:''}
    <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></span>
  </a>`}).join('')||'<div class="empty">لا تطبيقات بعد</div>';
</script>
</body>
</html>
